<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Multicapas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="wrap">
  <h1>Agenda</h1>
  <p class="sub">Tus contactos, guardados en el servidor.</p>

  <div class="grid">
    <section class="panel" aria-labelledby="t-lista">
      <h2 id="t-lista">Contactos</h2>
      <div class="toolbar">
        <input id="buscar" type="search" placeholder="Buscar por nombre, apellido o teléfono" aria-label="Buscar contactos">
        <button id="recargar" class="ghost" type="button">Recargar</button>
      </div>
      <div id="estado-lista" class="msg error" hidden></div>
      <p id="contador" class="count" aria-live="polite"></p>
      <div id="lista"></div>
    </section>

    <section class="panel" aria-labelledby="t-nuevo">
      <h2 id="t-nuevo">Nuevo contacto</h2>
      <div id="estado-form" class="msg" hidden></div>
      <form id="form" novalidate>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" autocomplete="given-name" required>
        <label for="apellido">Apellido</label>
        <input id="apellido" name="apellido" autocomplete="family-name" required>
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" autocomplete="tel" required>
        <button id="guardar" class="form-btn" type="submit">Guardar contacto</button>
      </form>
    </section>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
